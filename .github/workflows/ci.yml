name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-charts-dev qt6-serialbus-dev qt6-serialport-dev libqt6sql6-sqlite libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

  build-windows:
    name: Windows Qt 6.8 MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtcharts qtserialbus qtserialport"
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --prefix "$pwd/dist"

          windeployqt.exe `
            --release `
            --compiler-runtime `
            --no-translations `
            --verbose 2 `
            --dir "$pwd/dist/bin" `
            "$pwd/dist/bin/plc_host.exe"

          Write-Host "===== Package Files ====="
          Get-ChildItem "$pwd/dist/bin" -Recurse

          Write-Host "===== EXE Dependencies ====="
          dumpbin /DEPENDENTS "$pwd/dist/bin/plc_host.exe"

      - name: Smoke Test Packaged EXE
        shell: pwsh
        run: |
          $exe = "$pwd/dist/bin/plc_host.exe"
          Write-Host "Starting packaged executable: $exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory "$pwd/dist/bin" -PassThru
          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            throw "plc_host.exe exited during startup. ExitCode=$($process.ExitCode)"
          }

          Write-Host "plc_host.exe stayed running for 5 seconds: startup smoke test passed."
          Stop-Process -Id $process.Id -Force

      - name: Create ZIP
        shell: pwsh
        run: 7z a plc_host-windows-x64.zip "$pwd/dist/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plc_host-windows-x64
          path: plc_host-windows-x64.zip
